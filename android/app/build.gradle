plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

android {
    namespace = "com.sdkdoconline.sdkdoconline"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.sdkdoconline.sdkdoconline"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libflutter.so'
        pickFirst 'lib/x86_64/libflutter.so'
        pickFirst 'lib/armeabi-v7a/libflutter.so'
        pickFirst 'lib/armeabi-v7a/libflutter.so'
    }
}

dependencies {
    implementation ("com.gitlab.doconline-android:library:0.0.27") {
        exclude group: 'io.flutter', module: 'flutter_embedding_release'
    }
    implementation "androidx.appcompat:appcompat:1.7.1"
 /*   implementation "com.google.android.material:material:1.9.0"*/
    /*implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"*/
    implementation 'com.google.android.gms:play-services-base:18.2.0'
    implementation "com.github.bumptech.glide:glide:4.16.0"
}

/*configurations.all {
    exclude group: 'io.flutter', module: 'flutter_embedding_debug'
}*/

flutter {
    source = "../.."
}
